<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunt Complete!</title>
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lato:400,700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='scavenger_hunt/style.css') }}">
</head>
<body class="w3-light-grey">

<!-- Navbar -->
<div class="w3-top">
    <div class="w3-bar w3-black w3-card">
        <a class="w3-bar-item w3-button w3-padding-large" href="/">HOME</a>
        <a class="w3-bar-item w3-button w3-padding-large" href="{{ url_for('scavenger_hunt.start') }}">PLAY AGAIN</a>
    </div>
</div>

<!-- Page content -->
<div class="w3-content" style="max-width:800px; margin-top:46px">

    <!-- Success Message -->
    <div class="w3-container w3-center w3-padding-64">
        <div class="w3-card-4 w3-white w3-round-large success-card">
            <div class="w3-container w3-padding-32">
                <h1 style="font-size: 72px; margin: 20px 0;">🎉</h1>
                <h1 class="w3-text-green">Congratulations!</h1>
                <h3>You've completed the scavenger hunt!</h3>
                <p class="w3-large" style="margin: 30px 0;">
                    You successfully solved all the clues. Well done!
                </p>
                <a href="{{ url_for('scavenger_hunt.start') }}" class="w3-button w3-black w3-large w3-round w3-margin-top">
                    Play Again
                </a>
                <a href="/" class="w3-button w3-light-grey w3-large w3-round w3-margin-top w3-margin-left">
                    Go Home
                </a>
            </div>
        </div>
    </div>

</div>

</html>
