{% extends "base.html" %}
{% block title %}One Question a Day{% endblock %}
{% block tone %}blush{% endblock %}
{% block hero %}
<h1>One Question a Day</h1>
<p class="lede">Daily journal with thoughtful prompts.</p>
{% endblock %}
{% block content %}
<form action="{{ url_for('journal.home') }}" method="post">
    <div class="field">
        <label for="name">Enter your name</label>
        <input type="text" id="name" name="name" required autocomplete="given-name">
    </div>
    <button type="submit" class="btn">Start</button>
</form>
{% endblock %}
